name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:

# ---------------- WINDOWS ----------------
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build app
        run: python build.py --platform windows

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: iscc installer.iss

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/ContiniumSetup.exe


# ---------------- LINUX ----------------
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y libegl1 libxkbcommon-x11-0 fuse
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build app
        run: python build.py --platform linux

      - name: Build AppImage (simple approach placeholder)
        run: |
          mkdir -p AppDir
          cp -r dist/Continium/* AppDir/

          # NOTE: real AppImage tool should be added later
          tar -czf Continium-Linux.tar.gz AppDir

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: Continium-Linux.tar.gz


# ---------------- MACOS ----------------
  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build app
        run: python build.py --platform macos

      - name: Create DMG
        run: |
          hdiutil create \
            -volname Continium \
            -srcfolder dist/Continium.app \
            -ov -format UDZO \
            Continium.dmg

      - name: Upload macOS dmg
        uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: Continium.dmg


# ---------------- RELEASE ----------------
  release:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: manual-${{ github.run_number }}
          name: Manual build ${{ github.run_number }}
          files: |
            release/**/*